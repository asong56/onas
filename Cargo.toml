[workspace]
members = [".", "x265-sys"]
resolver = "2"

[package]
name        = "onas"
version     = "0.2.0"
edition     = "2021"
description = "Image conversion, audio transcoding, and video transcoding CLI"
license     = "MIT"

[[bin]]
name = "onas"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
log        = "0.4"
env_logger = "0.11"
bytemuck   = "1"

# ── image (pure Rust) ─────────────────────────────────────────────────────────
zune-jpeg  = "0.4"
zune-png   = "0.4"
zune-core  = "0.4"
# image 0.25 handles WebP decode/encode and AVIF decode via dav1d
image      = { version = "0.25", default-features = false,
               features = ["jpeg", "png", "webp", "avif"] }
# AVIF encode: pure Rust (uses rav1e internally)
ravif      = "0.13"
# AVIF decode + AV1: dav1d C library (vcpkg on Windows)
dav1d      = "0.11"
# JXL decode: pure Rust
jxl-oxide  = "0.12"
# JXL encode: cmake build of libjxl, works on all 3 platforms
jpegxl-src = "0.12"
jpegxl-rs  = { version = "0.11", features = ["vendored"] }

# ── metadata ──────────────────────────────────────────────────────────────────
# nom-exif 3.x: read-only for images; we use it for EXIF dump
nom-exif   = "3"
# lofty: pure Rust, read + write audio tags (ID3v2, VorbisComments, MP4 ilst)
lofty      = "0.24"

# ── audio decode (pure Rust) ──────────────────────────────────────────────────
symphonia  = { version = "0.6", features = ["all"] }
webm-iterable = "0.6"

# ── audio encode ──────────────────────────────────────────────────────────────
# Opus: audiopus wraps libopus (vcpkg on Windows, apt on Linux, brew on macOS)
audiopus   = "0.2"
# FLAC encode: flac-bound wraps libFLAC (vcpkg on Windows)
# Using "libflac-nobuild" so vcpkg-installed libFLAC is linked via pkg-config
flac-bound = { version = "0.5", default-features = false, features = ["libflac-nobuild"] }
# AAC encode: fdk-aac wraps libfdk-aac (vcpkg on Windows)
fdk-aac    = "0.8"

# ── video ────────────────────────────────────────────────────────────────────
# H.264 decode: rust_h264 (pure Rust)
rust_h264  = "0.4"
# H.264 encode: x264 (vcpkg x264 on Windows)
x264       = "0.5"
# H.265 decode: libde265 (vcpkg libde265 on Windows)
libde265   = "0.2"
# H.265 encode: x265-sys (our own FFI, vcpkg x265 on Windows)
x265-sys   = { path = "x265-sys" }
# VP9: pin to 04df690 — removes #![feature(cstr_to_str)], avoids missing ffi::VPX_ENCODER_ABI_VERSION in abb717b
vpx        = { git = "https://github.com/DiamondLovesYou/rust-vpx", rev = "04df690" }
# AV1 decode: dav1d (already in deps above for AVIF, shared)
# AV1 encode: rav1e (pure Rust) — svt-av1-sys requires bindgen at build time
#             which is complex on Windows CI; rav1e is the safe fallback
rav1e      = { version = "0.8", default-features = false, features = ["threading"] }
# MKV demux + mux: pure Rust
matroska   = "0.6"

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

# codec crates need speed, override the global "z"
[profile.release.package.dav1d]
opt-level = 3
[profile.release.package.ravif]
opt-level = 3
[profile.release.package.rav1e]
opt-level = 3
[profile.release.package.rust_h264]
opt-level = 3
