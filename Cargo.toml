[workspace]
members = [".", "x265-sys"]
resolver = "2"

[package]
name        = "onas"
version     = "0.2.0"
edition     = "2021"
description = "Image conversion, audio transcoding, and video transcoding CLI"
license     = "MIT"
build       = "build.rs"

[lib]
name = "onas"
path = "src/lib.rs"

[[bin]]
name = "onas"
path = "src/main.rs"

[build-dependencies]
cc         = "1"
pkg-config = "0.3"

[dependencies]
clap       = { version = "4", features = ["derive"] }
anyhow     = "1"
log        = "0.4"
env_logger = "0.11"
bytemuck   = "1"
# ── library / CLI machine-readable interface ─────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# ── image ─────────────────────────────────────────────────────────
zune-jpeg  = "0.4"
zune-png   = "0.4"
zune-core  = "0.4"
image      = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "avif"] }
ravif      = "0.13"
dav1d      = "0.11"
jxl-oxide  = "0.12"
jpegxl-src = "0.12"
jpegxl-rs  = { version = "0.11", features = ["vendored"] }

# ── metadata ──────────────────────────────────────────────────────────────────
nom-exif   = "3"
lofty      = "0.24"

# ── audio decode (pure Rust) ──────────────────────────────────────────────────
symphonia  = { version = "0.6", features = ["all"] }
webm-iterable = "0.6"

# ── audio encode ──────────────────────────────────────────────────────────────
audiopus   = "0.2"
flac-bound = { version = "0.5", default-features = false, features = ["libflac-nobuild"] }
fdk-aac    = "0.8"

# ── video ────────────────────────────────────────────────────────────────────
rust_h264  = "0.4"
x264       = "0.5"
libde265   = "0.2"
x265-sys   = { path = "x265-sys" }
vpx        = { git = "https://github.com/DiamondLovesYou/rust-vpx", rev = "04df690" }
vpx-sys    = { git = "https://github.com/DiamondLovesYou/rust-vpx", rev = "04df690", package = "libvpx-sys" }
rav1e      = { version = "0.8", default-features = false, features = ["threading"] }
matroska   = "0.6"

[patch."https://github.com/DiamondLovesYou/rust-vpx"]
vpx       = { path = "vendor/vpx" }
libvpx-sys = { path = "vendor/vpx-sys" }

[profile.release]
opt-level     = "z"
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"

[profile.release.package.dav1d]
opt-level = 3
[profile.release.package.ravif]
opt-level = 3
[profile.release.package.rav1e]
opt-level = 3
[profile.release.package.rust_h264]
opt-level = 3
